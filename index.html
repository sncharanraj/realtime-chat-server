<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RealTime Chat</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ─── RESET & VARS ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deepest:   #0a0b0f;
  --bg-deep:      #11131a;
  --bg-surface:   #161924;
  --bg-raised:    #1e2230;
  --border:       #2a2e3d;
  --border-glow:  #3b5bdb;
  --text-primary: #eef0f4;
  --text-muted:   #6b7280;
  --text-system:  #60a5fa;
  --text-error:   #f87171;
  --accent:       #3b5bdb;
  --accent-hover: #4c6ef5;
  --green:        #51cf66;
  --amber:        #fcc419;
  --radius:       12px;
}

html, body {
  height: 100%;
  background: var(--bg-deepest);
  color: var(--text-primary);
  font-family: 'Sora', sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;                          /* no body scroll — app is full-viewport */
}

/* ─── LAYOUT SHELL ─────────────────────────────────────────── */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 760px;
  margin: 0 auto;
  /* subtle noise texture overlay */
  background:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E"),
    var(--bg-deepest);
}

/* ─── TOP BAR ──────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: var(--bg-deep);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 12px;
}
.topbar-left  { display: flex; align-items: center; gap: 10px; }
.topbar-right { display: flex; align-items: center; gap: 14px; }

.logo-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s ease infinite;
}
.logo-dot.offline { background: var(--text-muted); box-shadow: none; animation: none; }

.logo-text { font-weight: 600; font-size: 15px; letter-spacing: -0.3px; }

/* connection badge */
.conn-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 500;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(81,207,102,.08);
  color: var(--green);
  border: 1px solid rgba(81,207,102,.2);
  transition: all .3s;
}
.conn-badge.offline {
  background: rgba(107,114,128,.08);
  color: var(--text-muted);
  border-color: rgba(107,114,128,.2);
}
.conn-badge .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  animation: pulse 1.8s ease infinite;
}
.conn-badge.offline .dot { background: var(--text-muted); animation: none; }

/* online pills */
.online-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  display: flex; align-items: center; gap: 5px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 3px 10px 3px 5px;
  font-size: 11px; font-weight: 500;
  color: var(--text-primary);
  animation: fadeIn .3s ease;
}
.pill .avatar-sm {
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700;
}

/* ─── MESSAGE AREA ─────────────────────────────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar          { width: 6px; }
.messages::-webkit-scrollbar-track    { background: transparent; }
.messages::-webkit-scrollbar-thumb    { background: var(--border); border-radius: 3px; }

/* single message row */
.msg {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 6px 10px;
  border-radius: 10px;
  transition: background .15s;
  animation: fadeSlideUp .28s ease;
}
.msg:hover { background: rgba(255,255,255,.02); }

/* avatar circle */
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
  flex-shrink: 0;
  border: 2px solid transparent;
}

/* message body */
.msg-body { display: flex; flex-direction: column; min-width: 0; }
.msg-header { display: flex; align-items: baseline; gap: 8px; }
.msg-name { font-weight: 600; font-size: 13px; }
.msg-time { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.msg-text { font-size: 14px; color: #d1d5db; line-height: 1.5; word-break: break-word; margin-top: 1px; }

/* system messages */
.msg.system {
  justify-content: center;
  padding: 8px 10px;
}
.msg.system .sys-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(96,165,250,.07);
  border: 1px solid rgba(96,165,250,.15);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--text-system);
}
.msg.system.leave .sys-pill {
  background: rgba(252,196,25,.06);
  border-color: rgba(252,196,25,.18);
  color: var(--amber);
}
.msg.error .msg-text { color: var(--text-error); }

/* "you" messages — right aligned bubble */
.msg.own {
  flex-direction: row-reverse;
  text-align: right;
}
.msg.own .msg-header { flex-direction: row-reverse; }
.msg.own .msg-text {
  background: var(--accent);
  color: #fff;
  display: inline-block;
  padding: 6px 12px;
  border-radius: 14px 14px 4px 14px;
  font-size: 14px;
  line-height: 1.5;
  max-width: 340px;
  margin-left: auto;
}
.msg.own .msg-name { color: var(--accent-hover); }

/* ─── INPUT DOCK ───────────────────────────────────────────── */
.input-dock {
  padding: 16px 20px 20px;
  background: var(--bg-deep);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

/* slash-command hint bar */
.cmd-hint {
  display: none;
  gap: 6px;
  padding: 0 0 10px 2px;
  flex-wrap: wrap;
}
.cmd-hint.visible { display: flex; }
.cmd-chip {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px 9px;
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
.cmd-chip:hover { border-color: var(--accent); color: var(--text-primary); }

.input-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 6px 6px 16px;
  transition: border-color .25s;
}
.input-row:focus-within { border-color: var(--border-glow); }

.input-row input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: 'Sora', sans-serif;
  font-size: 14px;
  padding: 6px 0;
  min-width: 0;
}
.input-row input::placeholder { color: var(--text-muted); }
.input-row input:disabled     { opacity: .4; cursor: not-allowed; }

.send-btn {
  display: flex; align-items: center; justify-content: center;
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--accent);
  border: none;
  cursor: pointer;
  transition: background .2s, transform .1s;
  flex-shrink: 0;
}
.send-btn:hover  { background: var(--accent-hover); }
.send-btn:active { transform: scale(.92); }
.send-btn:disabled { background: var(--bg-raised); cursor: not-allowed; }
.send-btn svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ─── LOGIN OVERLAY ────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(10,11,15,.85);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  animation: fadeIn .25s ease;
}
.login-card {
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 36px 36px;
  width: 100%; max-width: 380px;
  box-shadow: 0 24px 60px rgba(0,0,0,.4);
  animation: slideUp .3s cubic-bezier(.22,1,.36,1);
}
.login-card .card-icon { font-size: 36px; text-align: center; margin-bottom: 8px; }
.login-card h2 { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.login-card p  { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }

.login-card label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .8px; }
.login-card input {
  width: 100%;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text-primary);
  font-family: 'Sora', sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color .25s;
}
.login-card input:focus { border-color: var(--border-glow); }
.login-card input::placeholder { color: var(--text-muted); }

.login-btn {
  width: 100%; margin-top: 20px;
  background: var(--accent);
  border: none; border-radius: 10px;
  padding: 13px;
  color: #fff; font-family: 'Sora', sans-serif;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  transition: background .2s, transform .1s;
}
.login-btn:hover  { background: var(--accent-hover); }
.login-btn:active { transform: scale(.97); }

.login-error {
  margin-top: 12px;
  text-align: center;
  font-size: 12px;
  color: var(--text-error);
  min-height: 16px;
}

/* ─── KEYFRAMES ────────────────────────────────────────────── */
@keyframes pulse       { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn      { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp     { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ──────────────────────────────────────── -->
<div class="overlay" id="loginOverlay">
  <div class="login-card">
    <div class="card-icon">💬</div>
    <h2>RealTime Chat</h2>
    <p>Pick a name and jump in</p>
    <label for="usernameInput">Username</label>
    <input type="text" id="usernameInput" placeholder="e.g. Alice" autocomplete="off" />
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="joinBtn">Join Chat</button>
  </div>
</div>

<!-- ── MAIN APP ───────────────────────────────────────────── -->
<div class="app">

  <!-- top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-dot" id="connDot"></div>
      <span class="logo-text">RealTime Chat</span>
    </div>
    <div class="topbar-right">
      <div class="online-pills" id="onlinePills"></div>
      <div class="conn-badge" id="connBadge">
        <span class="dot"></span>
        <span id="connText">Connected</span>
      </div>
    </div>
  </div>

  <!-- messages scroll -->
  <div class="messages" id="messagesArea"></div>

  <!-- input dock -->
  <div class="input-dock">
    <div class="cmd-hint" id="cmdHint">
      <span class="cmd-chip" data-cmd="/help">/help</span>
      <span class="cmd-chip" data-cmd="/users">/users</span>
      <span class="cmd-chip" data-cmd="/ping">/ping</span>
    </div>
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Type a message … or try /help" autocomplete="off" disabled />
      <button class="send-btn" id="sendBtn" disabled>
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ── APP LOGIC ─────────────────────────────────────────── -->
<script>
/* ══════════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════════ */
// Auto-detect WebSocket URL based on environment
// Local dev: ws://127.0.0.1:8765
// Deployed:  wss://your-domain.com (secure WebSocket over HTTPS)
const WS_URL = "wss://realtime-chat-server-qtor.onrender.com";

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
let ws            = null;
let myUsername    = "";
let onlineUsers   = new Set();          // track who is online client-side

/* ══════════════════════════════════════════════════════════════
   DOM REFS  (grabbed once)
   ══════════════════════════════════════════════════════════════ */
const $overlay      = document.getElementById("loginOverlay");
const $usernameIn   = document.getElementById("usernameInput");
const $joinBtn      = document.getElementById("joinBtn");
const $loginError   = document.getElementById("loginError");

const $connDot      = document.getElementById("connDot");
const $connBadge    = document.getElementById("connBadge");
const $connText     = document.getElementById("connText");
const $onlinePills  = document.getElementById("onlinePills");

const $messages     = document.getElementById("messagesArea");
const $msgInput     = document.getElementById("msgInput");
const $sendBtn      = document.getElementById("sendBtn");
const $cmdHint      = document.getElementById("cmdHint");

/* ══════════════════════════════════════════════════════════════
   COLOUR PALETTE  –  deterministic per username
   ══════════════════════════════════════════════════════════════ */
const COLOURS = ["#f472b6","#60a5fa","#a78bfa","#34d399","#fb923c","#fbbf24","#f87171","#38bdf8"];
function colourFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return COLOURS[Math.abs(h) % COLOURS.length];
}
function initials(name) { return name.charAt(0).toUpperCase(); }

/* ══════════════════════════════════════════════════════════════
   LOGIN FLOW
   ══════════════════════════════════════════════════════════════ */
function attemptJoin() {
  const name = $usernameIn.value.trim();
  if (!name) { $loginError.textContent = "Username can't be empty"; return; }
  if (name.length > 20) { $loginError.textContent = "Max 20 characters"; return; }
  $loginError.textContent = "";
  myUsername = name;
  connectWebSocket();
}

$joinBtn.addEventListener("click", attemptJoin);
$usernameIn.addEventListener("keydown", e => { if (e.key === "Enter") attemptJoin(); });

/* ══════════════════════════════════════════════════════════════
   WEBSOCKET  –  connect / reconnect
   ══════════════════════════════════════════════════════════════ */
let reconnectAttempts = 0;
const MAX_RETRIES     = 8;
const RETRY_DELAY     = 2000;   // ms

function connectWebSocket() {
  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    $loginError.textContent = "Could not create WebSocket. Is the server running?";
    return;
  }

  ws.onopen = () => {
    reconnectAttempts = 0;
    // hide login, show app
    $overlay.style.display = "none";
    setConnected(true);
    enableInput(true);

    // HANDSHAKE — first message must be the username
    ws.send(JSON.stringify({ username: myUsername }));
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      handleMessage(msg);
    } catch (e) {
      console.error("Bad JSON from server:", event.data);
    }
  };

  ws.onerror = () => {
    // onerror always fires before onclose — just log, handle in onclose
    console.warn("WebSocket error");
  };

  ws.onclose = () => {
    setConnected(false);
    enableInput(false);
    addSystemMessage("You got disconnected.", "leave");
    scheduleReconnect();
  };
}

function scheduleReconnect() {
  if (reconnectAttempts >= MAX_RETRIES) {
    addSystemMessage("Could not reconnect. Refresh the page to try again.", "leave");
    return;
  }
  reconnectAttempts++;
  $connText.textContent = `Reconnecting… (${reconnectAttempts})`;
  setTimeout(connectWebSocket, RETRY_DELAY);
}

/* ══════════════════════════════════════════════════════════════
   INCOMING MESSAGE ROUTER
   ══════════════════════════════════════════════════════════════ */
function handleMessage(msg) {
  const { sender, content, msg_type } = msg;

  // ── track online users from system messages ──
  if (msg_type === "system") {
    const joinMatch  = content.match(/^(.+) joined the chat\.$/);
    const leaveMatch = content.match(/^(.+) left the chat\.$/);
    if (joinMatch)  { onlineUsers.add(joinMatch[1]);     renderOnlinePills(); }
    if (leaveMatch) { onlineUsers.delete(leaveMatch[1]); renderOnlinePills(); }
  }

  // ── render ──
  if (msg_type === "system") {
    const isLeave = content.includes("left the chat");
    addSystemMessage(content, isLeave ? "leave" : "join");
  } else if (msg_type === "error") {
    addErrorMessage(content);
  } else {
    addChatMessage(sender, content, sender === myUsername);
  }
}

/* ══════════════════════════════════════════════════════════════
   RENDER HELPERS
   ══════════════════════════════════════════════════════════════ */
function now() {
  return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
}

function addChatMessage(sender, text, isOwn) {
  const colour = colourFor(sender);
  const el = document.createElement("div");
  el.className = "msg" + (isOwn ? " own" : "");
  el.innerHTML = `
    <div class="avatar" style="background:${colour}20; border-color:${colour}; color:${colour};">${initials(sender)}</div>
    <div class="msg-body">
      <div class="msg-header">
        <span class="msg-name" style="color:${colour};">${escapeHtml(sender)}</span>
        <span class="msg-time">${now()}</span>
      </div>
      <div class="msg-text">${escapeHtml(text)}</div>
    </div>`;
  $messages.appendChild(el);
  scrollToBottom();
}

function addSystemMessage(text, flavour) {   // flavour: "join" | "leave"
  const el = document.createElement("div");
  el.className = "msg system" + (flavour === "leave" ? " leave" : "");
  el.innerHTML = `<div class="sys-pill">⚡ ${escapeHtml(text)}</div>`;
  $messages.appendChild(el);
  scrollToBottom();
}

function addErrorMessage(text) {
  const el = document.createElement("div");
  el.className = "msg error";
  el.innerHTML = `
    <div class="avatar" style="background:#f8717120; border-color:#f87171; color:#f87171;">!</div>
    <div class="msg-body">
      <div class="msg-header">
        <span class="msg-name" style="color:#f87171;">SERVER</span>
        <span class="msg-time">${now()}</span>
      </div>
      <div class="msg-text">${escapeHtml(text)}</div>
    </div>`;
  $messages.appendChild(el);
  scrollToBottom();
}

function scrollToBottom() {
  $messages.scrollTop = $messages.scrollHeight;
}

/* ══════════════════════════════════════════════════════════════
   ONLINE PILLS  –  sidebar user list
   ══════════════════════════════════════════════════════════════ */
function renderOnlinePills() {
  $onlinePills.innerHTML = "";
  onlineUsers.forEach(name => {
    const c = colourFor(name);
    const pill = document.createElement("div");
    pill.className = "pill";
    pill.innerHTML = `<div class="avatar-sm" style="background:${c}25; color:${c};">${initials(name)}</div>${escapeHtml(name)}`;
    $onlinePills.appendChild(pill);
  });
}

/* ══════════════════════════════════════════════════════════════
   SENDING
   ══════════════════════════════════════════════════════════════ */
function sendMessage() {
  const text = $msgInput.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  ws.send(JSON.stringify({ content: text }));
  $msgInput.value = "";
  $msgInput.focus();
}

$sendBtn.addEventListener("click", sendMessage);

$msgInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

/* ══════════════════════════════════════════════════════════════
   SLASH-COMMAND CHIPS  –  click to insert
   ══════════════════════════════════════════════════════════════ */
document.querySelectorAll(".cmd-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    $msgInput.value = chip.dataset.cmd;
    $msgInput.focus();
  });
});

// show/hide cmd hint bar when input is focused & empty
$msgInput.addEventListener("focus", () => {
  if (!$msgInput.value) $cmdHint.classList.add("visible");
});
$msgInput.addEventListener("input", () => {
  $cmdHint.classList.toggle("visible", $msgInput.value === "");
});
$msgInput.addEventListener("blur", () => {
  setTimeout(() => $cmdHint.classList.remove("visible"), 150);
});

/* ══════════════════════════════════════════════════════════════
   CONNECTION STATUS UI
   ══════════════════════════════════════════════════════════════ */
function setConnected(yes) {
  $connDot.classList.toggle("offline", !yes);
  $connBadge.classList.toggle("offline", !yes);
  if (yes) $connText.textContent = "Connected";
}

function enableInput(yes) {
  $msgInput.disabled  = !yes;
  $sendBtn.disabled   = !yes;
  if (yes) $msgInput.focus();
}

/* ══════════════════════════════════════════════════════════════
   TINY UTIL
   ══════════════════════════════════════════════════════════════ */
function escapeHtml(str) {
  const d = document.createElement("div");
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}
</script>
</body>
</html>
